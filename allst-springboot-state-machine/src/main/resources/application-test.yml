spring:
  datasource:
    url: jdbc:h2:mem:statemachine;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

statemachine:
  trade:
    high-risk-score: 80
    pay-timeout-minutes: 30
    scan-delay-ms: 3600000
