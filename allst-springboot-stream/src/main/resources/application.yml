spring:
  application:
    name: allst-springboot-stream
  datasource:
    # 默认 H2 内存库，开箱即跑，无需外部数据库。
    url: jdbc:h2:mem:stream-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true

server:
  port: 8710

logging:
  level:
    com.allst.boot: info