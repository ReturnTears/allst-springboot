# 启动：--spring.profiles.active=postgres
# 先创建库：CREATE DATABASE allst;
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/allst
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
