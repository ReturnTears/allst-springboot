# 启动：--spring.profiles.active=mysql
# 先创建库：CREATE DATABASE allst_security DEFAULT CHARACTER SET utf8mb4;
# 表结构可由 JPA ddl-auto=update 生成，也可改成 validate 后执行 db/schema-mysql.sql。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/allst_security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
