# 本机没有 MySQL 时使用：--spring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:mem:allst_redis;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
