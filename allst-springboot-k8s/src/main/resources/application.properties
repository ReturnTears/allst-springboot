server.port=8100
spring.application.name=allst-springboot-k8s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# 写操作和 Pod 日志只允许这个命名空间。集群内由 Downward API 的 K8S_NAMESPACE 覆盖。
k8s.namespace=allst-demo
# 留空时自动选择：Pod 内读 ServiceAccount，本地读 ~/.kube/config 或 KUBECONFIG。
k8s.master-url=
k8s.trust-certs=false

# 集群内容器会用 ConfigMap 的 DEMO_MESSAGE 覆盖这一项。
demo.message=hello from local properties
