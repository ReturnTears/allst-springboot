apiVersion: apps/v1
kind: Deployment
metadata:
  name: allst-springboot-k8s
  namespace: allst-demo
  labels:
    app: allst-springboot-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allst-springboot-k8s
  template:
    metadata:
      labels:
        app: allst-springboot-k8s
    spec:
      serviceAccountName: allst-k8s
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: allst/allst-springboot-k8s:1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: allst-k8s-config
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
