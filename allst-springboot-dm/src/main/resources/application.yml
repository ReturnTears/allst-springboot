spring:
  application:
    name: allst-springboot-dm
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/allst_dm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc.time_zone: Asia/Shanghai
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 2s
    lettuce:
      pool:
        enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8367

dm:
  # DDL 生成结果的导出目录（相对工作目录）
  ddl:
    output-dir: ./generated-ddl
  # false：缓存装饰器/幂等命令走内存实现，启动不依赖 Redis
  # true ：走 Redis 实现（StringRedisTemplate），需要本机 6379 可连
  redis:
    enabled: false
  promotion:
    vip-discount: 0.85
    full-reduction-threshold: 100
    full-reduction-amount: 20
  risk:
    high-amount-threshold: 5000

logging:
  level:
    com.allst.springboot: INFO
